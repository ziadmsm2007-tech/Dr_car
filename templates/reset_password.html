{% extends "base.html" %}
{% block title %}{{ t('reset_title') }} - Dr. Car{% endblock %}
{% block content %}
<div class="auth-wrap fade-up">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-icon">🛡️</div>
            <h3 class="mb-1">{{ t('reset_title') }}</h3>
        </div>
        <div class="auth-body">
            <form method="POST" id="resetForm">
                <div class="mb-3">
                    <label class="form-label">{{ t('reset_new_pass') }}</label>
                    <div class="input-icon-wrap with-toggle">
                        <span class="lead">🔑</span>
                        <input type="password" name="new_password" id="newPassword" class="form-control" placeholder="••••••••" minlength="6" autocomplete="new-password" required>
                        <button type="button" class="pass-toggle-btn" data-toggle-for="newPassword" aria-label="{{ t('auth_show_password') }}">👁️</button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">{{ t('auth_confirm_password') }}</label>
                    <div class="input-icon-wrap with-toggle">
                        <span class="lead">🔑</span>
                        <input type="password" name="confirm_password" id="confirmPassword" class="form-control" placeholder="••••••••" minlength="6" autocomplete="new-password" required>
                        <button type="button" class="pass-toggle-btn" data-toggle-for="confirmPassword" aria-label="{{ t('auth_show_password') }}">👁️</button>
                    </div>
                    <div class="form-text" id="pwMismatchHint" style="display:none; color:var(--danger,#dc3545); font-weight:600">{{ t('flash_pass_mismatch') }}</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">{{ t('reset_btn') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function(){
    document.querySelectorAll('.pass-toggle-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
            var input = document.getElementById(btn.getAttribute('data-toggle-for'));
            if(!input) return;
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.textContent = show ? '🙈' : '👁️';
        });
    });
    document.getElementById('resetForm').addEventListener('submit', function(e){
        var pw=document.getElementById('newPassword'), pw2=document.getElementById('confirmPassword');
        var hint=document.getElementById('pwMismatchHint');
        if(pw.value !== pw2.value){
            e.preventDefault();
            hint.style.display='block';
            pw2.focus();
        } else {
            hint.style.display='none';
        }
    });
})();
</script>
{% endblock %}
