{% extends "base.html" %}
{% block title %}{{ t('for_title') }} - AutoCare{% endblock %}
{% block content %}
<div class="auth-wrap fade-up">
    <div class="auth-card">
        <div class="auth-head">
            <div class="auth-icon">🔓</div>
            <h3 class="mb-1">{{ t('for_title') }}</h3>
            <p class="mb-0" style="color:rgba(255,255,255,.8)">{{ t('for_desc') }}</p>
        </div>
        <div class="auth-body">
            <form method="POST">
                <div class="mb-4">
                    <label class="form-label">{{ t('auth_email') }}</label>
                    <div class="input-icon-wrap">
                        <span class="lead">✉️</span>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">{{ t('for_btn') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
