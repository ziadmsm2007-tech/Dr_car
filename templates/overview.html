{% extends "base.html" %}
{% block title %}{{ t('nav_about') }} - AutoCare{% endblock %}
{% block content %}
<div class="page-head fade-up">
    <h3>{{ t('overview_title') }}</h3>
</div>

<div class="row g-4">
    <div class="col-lg-8">
        <div class="panel p-4 fade-up">
            <p class="lead" style="color:var(--navy-800);font-weight:600">{{ t('overview_lead') }}</p>
            <p class="text-muted">{{ t('overview_body') }}</p>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="panel p-4 text-center fade-up d-2">
            <div class="icon-badge mx-auto" style="width:64px;height:64px;font-size:1.8rem;">🛡️</div>
            <h5 class="fw-bold mt-2" style="color:var(--navy-800)">AutoCare</h5>
            <p class="text-muted mb-0">{{ t('brand_tagline') }}</p>
        </div>
    </div>
</div>
{% endblock %}
